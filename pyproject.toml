[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "berlin-urban-resilience-twin"
version = "1.0.0"
description = "Semantic urban resilience and explainable routing digital twin for Berlin"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nils Flöser"}]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "networkx>=3.5,<4",
  "pydantic>=2.11,<3",
  "pyshacl>=0.30,<1",
  "rdflib>=7.1,<8",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ingestion = [
  "osmnx>=2.0,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urban_resilience_twin"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
