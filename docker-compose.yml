services:
  fuseki:
    build:
      context: ./docker/fuseki
      args:
        JENA_VERSION: "6.2.0"
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki/databases
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FUSEKI_URL: http://fuseki:3030
    ports:
      - "8000:8000"
    depends_on:
      fuseki:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  fuseki-data:
